<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新北市選舉輿情分析系統 - 週報儀表板</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>
  
  <div class="container">
    <!-- Header -->
    <header class="header glass">
      <div class="brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM9 17H7V10H9V17ZM13 17H11V7H13V17ZM17 17H15V13H17V17Z" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>新北市選舉輿情分析</h1>
          <p>每週新聞爬網整合與情感分析儀表板</p>
        </div>
      </div>
      
      <div class="controls">
        <div class="date-select-wrapper">
          <label for="date-select">選擇週期基準日</label>
          <div class="date-picker-nav-group">
            <button id="btn-prev-date" class="btn-date-nav" title="前一週">◀</button>
            <input type="date" id="date-select" class="glass-input">
            <button id="btn-next-date" class="btn-date-nav" title="後一週">▶</button>
            <button id="btn-today" class="btn-date-today" title="回到本週">本週</button>
          </div>
          <div id="week-range-label" class="week-range-label">--</div>
        </div>
        <button id="btn-crawl" class="btn btn-secondary">
          <span class="btn-icon">🔄</span> 手動更新數據
        </button>
        <button id="btn-download" class="btn btn-primary">
          <span class="btn-icon">📥</span> 下載 PDF 報告
        </button>
      </div>
    </header>

    <!-- Progress / Loading Screen -->
    <div id="loading-overlay" class="overlay hidden">
      <div class="loader-card glass">
        <div class="spinner"></div>
        <h3>正在爬取並整理本週最新輿情資料...</h3>
        <p>這需要大約 20 到 40 秒，請稍候。</p>
        <div class="progress-bar-wrapper">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Stats Grid -->
    <section class="stats-grid">
      <!-- Summary Card -->
      <div class="card glass stat-card">
        <h2>本週輿情指標</h2>
        <div class="stat-main">
          <div class="stat-number" id="stat-total">0</div>
          <div class="stat-label">本週總聲量 (篇)</div>
        </div>
        <div class="stat-details">
          <div class="source-bar-wrapper">
            <span class="source-label">報社分佈</span>
            <div class="source-bar-progress">
              <div class="progress-segment p-udn" style="width: 0%" title="聯合報"></div>
              <div class="progress-segment p-ltn" style="width: 0%" title="自由時報"></div>
              <div class="progress-segment p-chinatimes" style="width: 0%" title="中國時報"></div>
            </div>
            <div class="source-legend">
              <span class="legend-item"><span class="dot udn"></span> 聯合報: <strong id="lbl-udn">0</strong></span>
              <span class="legend-item"><span class="dot ltn"></span> 自由時報: <strong id="lbl-ltn">0</strong></span>
              <span class="legend-item"><span class="dot chinatimes"></span> 中時: <strong id="lbl-chinatimes">0</strong></span>
            </div>
          </div>
        </div>
      </div>

    </section>

    <!-- Weekly News Section -->
    <main class="news-section">
      <div class="week-title glass">
        <h2>一週新聞爬取結果</h2>
        <p>每個日期為一個區塊，最多顯示 7 天資料</p>
      </div>

      <div id="week-container" class="week-grid">
        <!-- Dynamic Day Cards -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 新北市選舉輿情分析系統. All rights reserved.</p>
      <p>資料每日自動抓取自聯合報、自由電子報、中國時報電子報，分析結果僅供內部團隊評估選情使用。</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
